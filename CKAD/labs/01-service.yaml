apiVersion: v1
kind: Namespace
metadata:
  name: ckad-lab
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-config
  namespace: ckad-lab
data:
  APP_MODE: practice
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: ckad-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: nginx
          image: nginx:1.28-alpine
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: web-config
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: ckad-lab
spec:
  selector:
    app: wrong-label
  ports:
    - port: 80
      targetPort: 80
