apiVersion: v1
kind: Namespace
metadata:
  name: ckad-selector-lab
---
apiVersion: v1
kind: Pod
metadata:
  name: store-front
  namespace: ckad-selector-lab
  labels:
    app: store
    tier: frontend
spec:
  containers:
  - name: web
    image: nginx:stable-alpine
    ports:
    - containerPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: store-back
  namespace: ckad-selector-lab
  labels:
    app: store
    tier: backend
spec:
  containers:
  - name: web
    image: nginx:stable-alpine
    ports:
    - containerPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: billing-front
  namespace: ckad-selector-lab
  labels:
    app: billing
    tier: frontend
spec:
  containers:
  - name: web
    image: nginx:stable-alpine
    ports:
    - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: store
  namespace: ckad-selector-lab
spec:
  type: ClusterIP
  selector:
    app: store
    tier: backend
  ports:
  - port: 80
    targetPort: 80
