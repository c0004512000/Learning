<!doctype html>
<html lang="zh-Hant" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>叢集全貌：哪些機器執行，誰負責協調｜CKA Learning</title><link rel="stylesheet" href="../assets/learning.css"><link rel="stylesheet" href="../assets/lesson.css"><link rel="stylesheet" href="../assets/cka.css"><script src="../assets/learning-theme.js"></script></head><body><button class="theme-toggle" aria-label="切換深淺色模式">切換淺色</button><nav aria-label="學習導覽"><a href="../index.html">CKA 首頁</a><a href="../learning-map/index.html">學習地圖</a></nav><main><h1>架構分工速查</h1><dl><dt>節點（Node）</dt><dd>加入 Kubernetes 管理的機器。承載應用執行時稱工作節點；容器使用所在機器的資源。</dd><dt>控制平面（control plane）</dt><dd>負責整體狀況與執行安排的一組管理元件，本身也需要機器執行。</dd><dt>叢集（cluster）</dt><dd>由控制平面與工作節點共同形成的管理與執行系統。</dd></dl><p>角色分工不等於機器數量。單機練習可以兼任管理與執行；協調安排仍需要足夠的執行資源。</p><p><a href="../lessons/0003-cluster-roles.html">回第三堂 →</a> · <a href="https://kubernetes.io/docs/concepts/overview/components/">官方來源</a></p></main></body></html>
