<!doctype html>
<html lang="zh-Hant" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>映像與容器：準備好的程式，如何開始執行｜CKA Learning</title><link rel="stylesheet" href="../assets/learning.css"><link rel="stylesheet" href="../assets/lesson.css"><link rel="stylesheet" href="../assets/cka.css"><script src="../assets/learning-theme.js"></script></head><body><button class="theme-toggle" aria-label="切換深淺色模式">切換淺色</button><nav aria-label="學習導覽"><a href="../index.html">CKA 首頁</a><a href="../learning-map/index.html">學習地圖</a></nav><main><h1>映像與容器速查</h1><dl><dt>映像（image）</dt><dd>準備好的標準格式內容，包含應用及其執行所需檔案與啟動資訊。它本身不等於正在執行的應用。</dd><dt>容器（container）</dt><dd>依映像建立、供應用執行的隔離環境。仍依靠所在機器的作業系統與運算資源，可處於執行或停止狀態。</dd></dl><p>同一份映像可建立多個容器。停止其中一個不會改寫映像，也不表示其他容器會一起停止。</p><p>以映像交付程式時，修正版要建立新映像，再換用新版本執行；修改電腦上的原始碼不會自動更新舊容器。</p><p><a href="../lessons/0002-images-and-containers.html">回第二堂</a> · <a href="https://docs.docker.com/get-started/docker-concepts/the-basics/what-is-an-image/">映像來源</a> · <a href="https://docs.docker.com/get-started/docker-concepts/the-basics/what-is-a-container/">容器來源</a></p></main></body></html>
