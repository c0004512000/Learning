<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920"><defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#cbd5e1"/></marker></defs><style>
.title { font: 700 26px 'Arial', sans-serif; fill: #e2e8f0; }
.subtitle { font: 600 18px 'Arial', sans-serif; fill: #f8fafc; }
.text { font: 15px 'Arial', sans-serif; fill: #cbd5e1; }
.small { font: 13px 'Arial', sans-serif; fill: #94a3b8; }
.label { font: 600 15px 'Arial', sans-serif; fill: #f8fafc; }
.box { fill: #111827; stroke: #64748b; stroke-width: 2; rx: 14; ry: 14; }
.soft { fill: #0f172a; stroke: #334155; stroke-width: 2; rx: 14; ry: 14; }
.accent { fill: #0b1220; stroke: #60a5fa; stroke-width: 2; rx: 14; ry: 14; }
.green { fill: #071913; stroke: #34d399; stroke-width: 2; rx: 14; ry: 14; }
.yellow { fill: #1a1406; stroke: #fbbf24; stroke-width: 2; rx: 14; ry: 14; }
.purple { fill: #120d1f; stroke: #a78bfa; stroke-width: 2; rx: 14; ry: 14; }
.arrow { stroke: #cbd5e1; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead); }
</style>
<rect width="100%" height="100%" fill="#020617"/>
<text x="70" y="70" class="title">Build Once, Run Many / Deploy Many</text>
<text x="70" y="105" class="text">適合放在第一章收尾：一份 Image 可以建立多個 Container，也能作為多環境共享的建構成果。</text>
<rect x="100" y="190" width="340" height="200" class="accent"/>
<text x="130" y="245" class="subtitle">Build Once</text>
<text x="130" y="290" class="text">Dockerfile + source code</text>
<line x1="130" y1="310" x2="380" y2="310" class="arrow"/><text x="230" y="300" class="small">docker build</text>
<rect x="130" y="330" width="280" height="40" class="green"/><text x="270" y="357" class="small" text-anchor="middle">Image: demo-api:1.0</text>
<line x1="460" y1="350" x2="660" y2="200" class="arrow"/>
<line x1="460" y1="350" x2="660" y2="500" class="arrow"/>
<line x1="460" y1="350" x2="1090" y2="260" class="arrow"/>
<line x1="460" y1="350" x2="1090" y2="490" class="arrow"/>
<line x1="460" y1="350" x2="1090" y2="720" class="arrow"/>
<rect x="700" y="120" width="320" height="140" class="purple"/><text x="730" y="175" class="subtitle">Container A</text><text x="730" y="215" class="text">Host A　Port 8000</text>
<rect x="700" y="420" width="320" height="140" class="purple"/><text x="730" y="475" class="subtitle">Container B</text><text x="730" y="515" class="text">Host A　Port 8001</text>
<rect x="1090" y="190" width="360" height="140" class="soft"/><text x="1120" y="245" class="subtitle">Development</text><text x="1120" y="285" class="text">同一份 Image 作為建構成果</text>
<rect x="1090" y="420" width="360" height="140" class="soft"/><text x="1120" y="475" class="subtitle">Stage</text><text x="1120" y="515" class="text">同一份 Image，環境設定可不同</text>
<rect x="1090" y="650" width="360" height="140" class="soft"/><text x="1120" y="705" class="subtitle">Production</text><text x="1120" y="745" class="text">仍是同一份 Image，但外部條件不一定完全相同</text>
<rect x="170" y="700" width="760" height="120" class="yellow"/>
<text x="200" y="750" class="label">這張圖最想傳達的兩件事：</text>
<text x="200" y="785" class="small">1. 同一份 Image 可以建立多個 Container</text>
<text x="200" y="810" class="small">2. 同一份 Image 也可以作為不同部署環境共享的建構成果</text></svg>