<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="980" viewBox="0 0 1650 980"><defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#cbd5e1"/></marker></defs><style>
.title { font: 700 26px 'Arial', sans-serif; fill: #e2e8f0; }
.subtitle { font: 600 18px 'Arial', sans-serif; fill: #f8fafc; }
.text { font: 15px 'Arial', sans-serif; fill: #cbd5e1; }
.small { font: 13px 'Arial', sans-serif; fill: #94a3b8; }
.label { font: 600 15px 'Arial', sans-serif; fill: #f8fafc; }
.box { fill: #111827; stroke: #64748b; stroke-width: 2; rx: 14; ry: 14; }
.soft { fill: #0f172a; stroke: #334155; stroke-width: 2; rx: 14; ry: 14; }
.accent { fill: #0b1220; stroke: #60a5fa; stroke-width: 2; rx: 14; ry: 14; }
.green { fill: #071913; stroke: #34d399; stroke-width: 2; rx: 14; ry: 14; }
.yellow { fill: #1a1406; stroke: #fbbf24; stroke-width: 2; rx: 14; ry: 14; }
.purple { fill: #120d1f; stroke: #a78bfa; stroke-width: 2; rx: 14; ry: 14; }
.arrow { stroke: #cbd5e1; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead); }
</style>
<rect width="100%" height="100%" fill="#020617"/>
<text x="70" y="70" class="title">Dockerfile → Image → Container</text>
<text x="70" y="105" class="text">正式進入 Docker 時最關鍵的一張總覽圖：描述環境、建構成果、執行實例。</text>
<rect x="60" y="170" width="430" height="660" class="accent"/>
<text x="90" y="220" class="subtitle">1. Dockerfile</text><text x="90" y="255" class="text">描述如何準備執行環境</text>
<rect x="95" y="290" width="360" height="360" class="soft"/>
<text x="120" y="335" class="small">FROM python:3.12-slim</text><text x="120" y="380" class="small">WORKDIR /app</text><text x="120" y="425" class="small">COPY requirements.txt .</text><text x="120" y="470" class="small">RUN pip install -r requirements.txt</text><text x="120" y="515" class="small">COPY app.py .</text><text x="120" y="560" class="small">CMD ["uvicorn", "app:app", ...]</text>
<rect x="95" y="690" width="360" height="90" class="yellow"/><text x="115" y="735" class="small">本質：建構指示</text><text x="115" y="760" class="small">還不是執行中的環境</text>
<line x1="505" y1="500" x2="700" y2="500" class="arrow"/><text x="560" y="470" class="label">docker build</text>
<rect x="740" y="170" width="430" height="660" class="green"/>
<text x="770" y="220" class="subtitle">2. Image</text><text x="770" y="255" class="text">已經準備好的檔案系統內容與執行設定</text>
<rect x="775" y="300" width="360" height="330" class="soft"/>
<text x="800" y="345" class="small">• Python 3.12 runtime</text><text x="800" y="390" class="small">• FastAPI / Uvicorn</text><text x="800" y="435" class="small">• app.py</text><text x="800" y="480" class="small">• default command / metadata</text><text x="800" y="550" class="small">唯讀、可重複使用</text>
<rect x="775" y="690" width="360" height="90" class="yellow"/>
<text x="795" y="735" class="small">本質：靜態建構成果</text>
<text x="795" y="760" class="small">沒有正在執行的 Process，也沒有獨立 Kernel</text>
<line x1="1185" y1="500" x2="1380" y2="500" class="arrow"/><text x="1240" y="470" class="label">docker run</text>
<rect x="1410" y="170" width="180" height="660" class="purple"/>
<text x="1440" y="220" class="subtitle">3. Container</text><text x="1435" y="255" class="small">根據 Image 建立的執行實例</text>
<rect x="1435" y="310" width="130" height="170" class="box"/><text x="1500" y="365" class="small" text-anchor="middle">Process</text><text x="1500" y="395" class="small" text-anchor="middle">running</text><text x="1500" y="425" class="small" text-anchor="middle">isolated env</text>
<rect x="1435" y="515" width="130" height="140" class="box"/><text x="1500" y="575" class="small" text-anchor="middle">same image</text><text x="1500" y="605" class="small" text-anchor="middle">can create</text><text x="1500" y="635" class="small" text-anchor="middle">multiple containers</text>
<rect x="1430" y="690" width="140" height="90" class="yellow"/><text x="1450" y="735" class="small">本質：正在執行的實例</text></svg>