receivers:
  otlp:
    protocols:
      http:
        # This is the container network namespace, not the Windows host.
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  debug:
    verbosity: detailed

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]

