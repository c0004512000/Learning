# Reference fragment for a Collector distribution that includes tail_sampling
# (for example, contrib). The endpoint is intentionally non-routable.
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  tail_sampling:
    sampling_strategy: trace-complete
    decision_wait: 10s
    num_traces: 50000
    expected_new_traces_per_sec: 1000
    decision_cache:
      sampled_cache_size: 100000
      non_sampled_cache_size: 100000
    policies:
      - name: keep-errors
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: keep-slow
        type: latency
        latency:
          threshold_ms: 1000
      - name: baseline
        type: probabilistic
        probabilistic:
          sampling_percentage: 5
  batch:
    send_batch_size: 512

exporters:
  otlp/backend:
    endpoint: backend.example.invalid:4317

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, tail_sampling, batch]
      exporters: [otlp/backend]

