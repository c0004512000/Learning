name: Learning Map Live Smoke Test

on:
  push:
    branches: [main]
    paths:
      - "Skill/Learning/Test/v3/**"
      - ".github/workflows/learning-map-live-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Playwright library
        run: python -m pip install --disable-pip-version-check playwright

      - name: Run live GitHub Pages smoke test
        run: python Skill/Learning/Test/v3/live_smoke.py
